[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "shorts-render-pipeline"
version = "1.0.0"
description = "Deterministic vertical video build and verification pipeline: Markdown beat ingestion, EBU R128 (-18.5 LUFS) audio mastering, whisper.cpp word alignment, 1080x1920 FFmpeg composition, and pre-flight/SEO release gates."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
